name: gestor-frotas

services:

  rabbitmq:
    image: rabbitmq:${RABBITMQ_IMAGE_TAG}
    container_name: gestor-frotas-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gestor-frotas-rede

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: gestor-frotas-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-dados:/usr/share/elasticsearch/data
    networks:
      - gestor-frotas-rede

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: gestor-frotas-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=gestor-frotas-chave-de-encriptacao-demo-0001
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - gestor-frotas-rede

  configurador-kibana:
    image: curlimages/curl:latest
    container_name: gestor-frotas-configurador-kibana
    depends_on:
      kibana:
        condition: service_started
    volumes:
      - ./kibana:/config:ro
    entrypoint: ["/bin/sh", "/config/provisionar.sh"]
    networks:
      - gestor-frotas-rede

  configurador-elasticsearch:
    image: curlimages/curl:latest
    container_name: gestor-frotas-configurador-es
    depends_on:
      elasticsearch:
        condition: service_started
    volumes:
      - ./elasticsearch:/config:ro
    entrypoint: ["/bin/sh", "/config/aplicar-template.sh"]
    networks:
      - gestor-frotas-rede

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: gestor-frotas-logstash
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "9600:9600"
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      configurador-elasticsearch:
        condition: service_completed_successfully
    networks:
      - gestor-frotas-rede

  simulador:
    build:
      context: ./gestor-frotas-simulador
      dockerfile: Dockerfile
    container_name: gestor-frotas-simulador
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - gestor-frotas-rede

  api:
    build:
      context: ./gestor-frotas-api
      dockerfile: Dockerfile
    container_name: gestor-frotas-api
    environment:
      - Elasticsearch__Uri=http://elasticsearch:9200
    ports:
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_started
    networks:
      - gestor-frotas-rede

networks:
  gestor-frotas-rede:
    driver: bridge

volumes:
  rabbitmq-dados:
  elasticsearch-dados:
